<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhyo | Launching Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #8b5cf6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-left: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-left);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Split Screen Layout */
        .split-layout {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* Left Side - Content */
        .content-side {
            flex: 1;
            padding: 4rem 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background-color: white;
            z-index: 10;
        }

        /* Subtle Grid Pattern Background */
        .content-side::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
            z-index: -1;
        }

        .logo {
            position: absolute;
            top: 3rem;
            left: 10%;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f3e8ff;
            color: #6b21a8;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            width: max-content;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(124, 58, 237, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0);
            }
        }

        h1 {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 1.5rem;
            color: #0f172a;
            letter-spacing: -1.5px;
        }

        h1 span {
            color: var(--primary);
        }

        p {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 500px;
        }

        /* Minimalist Countdown */
        .countdown {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .time-box {
            display: flex;
            flex-direction: column;
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .time-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Form */
        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 500px;
            position: relative;
        }

        .notify-form input {
            flex: 1;
            padding: 1.2rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .notify-form input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .notify-form button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .notify-form button:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(124, 58, 237, 0.5);
        }

        .success-msg {
            display: none;
            margin-top: 1rem;
            color: #059669;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Right Side - Visual */
        .visual-side {
            flex: 1;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #e0e7ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Orbs behind image */
        .visual-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }

        .visual-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(124, 58, 237, 0.3);
            top: 20%;
            left: 20%;
        }

        .visual-orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(59, 130, 246, 0.2);
            bottom: 10%;
            right: 10%;
        }

        /* The 3D Image */
        .hero-image {
            width: 90%;
            max-width: 700px;
            height: auto;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 30px 40px rgba(124, 58, 237, 0.2));
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 968px) {
            .split-layout {
                flex-direction: column;
            }

            .content-side {
                padding: 8rem 5% 4rem;
                align-items: center;
                text-align: center;
            }

            .logo {
                left: 50%;
                transform: translateX(-50%);
                top: 2rem;
            }

            p {
                margin-left: auto;
                margin-right: auto;
            }

            .countdown {
                justify-content: center;
            }

            .notify-form {
                flex-direction: column;
                width: 100%;
            }

            .notify-form button {
                padding: 1.2rem;
            }

            .visual-side {
                min-height: 60vh;
                padding: 2rem;
            }

            .hero-image {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="split-layout">
        <!-- Left Side -->
        <div class="content-side">
            <div class="logo">Abhyo<span>.</span></div>

            <div class="badge">
                <div class="dot"></div> Coming Soon
            </div>

            <h1>Get ready to<br><span>Dominate</span> exams.</h1>
            <p>We are engineering India's most advanced AI-powered mock test platform. The smarter way to study is
                almost here.</p>

            <div class="countdown">
                <div class="time-box">
                    <div class="time-value" id="days">14</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-value" style="color: #cbd5e1; font-weight: 300;">:</div>
                <div class="time-box">
                    <div class="time-value" id="hours">08</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-value" style="color: #cbd5e1; font-weight: 300;">:</div>
                <div class="time-box">
                    <div class="time-value" id="minutes">45</div>
                    <div class="time-label">Mins</div>
                </div>
                <div class="time-value" style="color: #cbd5e1; font-weight: 300;">:</div>
                <div class="time-box">
                    <div class="time-value" id="seconds">22</div>
                    <div class="time-label">Secs</div>
                </div>
            </div>

            <form class="notify-form" id="notifyForm">
                <input type="email" id="emailInput" placeholder="Enter your email address" required>
                <button type="submit">Join the Waitlist</button>
            </form>
            <div class="success-msg" id="successMsg" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                You're on the list! Keep an eye on your inbox.
            </div>
        </div>

        <!-- Right Side -->
        <div class="visual-side">
            <div class="visual-orb visual-orb-1"></div>
            <div class="visual-orb visual-orb-2"></div>
            <img src="./images/hero-banner.png" alt="Abhyo Platform" class="hero-image">
        </div>
    </div>

    <script>
        // Countdown Logic
        function updateTimer() {
            const dest = new Date(new Date().getTime() + 14 * 24 * 60 * 60 * 1000).getTime();

            setInterval(() => {
                const now = new Date().getTime();
                const diff = dest - now;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days.toString().padStart(2, '0');
                document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            }, 1000);
        }
        updateTimer();

        // Form Submit
        document.getElementById('notifyForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const btn = this.querySelector('button');

            if (email) {
                btn.innerHTML = 'Joining...';
                btn.style.opacity = '0.8';

                setTimeout(() => {
                    this.style.display = 'none';
                    document.getElementById('successMsg').style.display = 'flex';
                }, 1000);
            }
        });
    </script>
</body>

</html>
